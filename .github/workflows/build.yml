name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The release build is unsigned here; signed APKs are built locally for releases.
      - name: Build debug and release
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Unit tests
        run: gradle testDebugUnitTest --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: astra-player-debug
          path: |
            app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
            app/build/outputs/apk/debug/app-x86_64-debug.apk
            app/build/outputs/apk/debug/app-universal-debug.apk
          retention-days: 14

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: astra-player-debug
          path: apks

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Make test media
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          mkdir -p media
          ffmpeg -v error -f lavfi -i testsrc2=size=640x360:rate=25 -f lavfi -i sine=frequency=440 -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac "media/Smoke video.mp4"
          ffmpeg -v error -f lavfi -i testsrc=size=320x240:rate=25 -f lavfi -i sine=frequency=300 -t 10 -c:v msmpeg4v2 -c:a mp3 "media/Old clip.avi"
          ffmpeg -v error -f lavfi -i sine=frequency=660 -t 15 -c:a libmp3lame "media/Smoke song.mp3"
          # Phone-style clip: one keyframe every 12 s, so a decoder restart mid-GOP shows as grey blocks.
          ffmpeg -v error -f lavfi -i testsrc2=size=720x1280:rate=30 -f lavfi -i sine=frequency=500 -t 30 -c:v libx264 -g 360 -keyint_min 360 -sc_threshold 0 -bf 2 -pix_fmt yuv420p -c:a aac "media/Long GOP.mp4"
          printf '1\n00:00:01,000 --> 00:00:15,000\nSmoke test subtitle\n' > "media/Smoke video.srt"

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/smoke-test.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test-results
          path: smoke/
          retention-days: 14
