pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // NewPipeExtractor is only published on JitPack.
        maven {
            url 'https://jitpack.io'
            content { includeGroup 'com.github.TeamNewPipe' }
        }
    }
}
rootProject.name = 'AstraPlayer'
include ':app'
